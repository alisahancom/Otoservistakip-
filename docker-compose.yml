services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: otoservis
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: otoservis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otoservis"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres_data:
